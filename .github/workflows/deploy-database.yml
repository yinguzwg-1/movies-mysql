name: 🚀 数据库 Schema 部署

on:
  push:
    branches: [ main, master ]
    paths:
      - 'database.sql'
      - 'src/**'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:
    inputs:
      deploy_type:
        description: '部署类型'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      auto_execute:
        description: '是否自动执行部署'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🔍 检查部署配置
      run: |
        DEPLOY_TYPE="${{ github.event.inputs.deploy_type || 'incremental' }}"
        AUTO_EXECUTE="${{ github.event.inputs.auto_execute || 'true' }}"
        
        echo "🚀 部署配置:"
        echo "📤 部署类型: $DEPLOY_TYPE"
        echo "📤 自动执行: $AUTO_EXECUTE"

    - name: 📤 上传项目文件
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT || '22' }}
        source: "./"
        target: "/tmp/movies-mysql-deploy"
        overwrite: true

    - name: 🔄 执行部署
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT || '22' }}
        command_timeout: "600s"
        script: |
          echo "🔄 执行部署..."
          
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type || 'incremental' }}"
          AUTO_EXECUTE="${{ github.event.inputs.auto_execute || 'true' }}"
          
          # 进入项目目录
          cd /tmp/movies-mysql-deploy
          
          # 检查 Node.js
          if ! command -v node &> /dev/null; then
            echo "📦 安装 Node.js..."
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          else
            echo "✅ Node.js 已安装: $(node --version)"
          fi
          
          # 安装依赖
          echo "📦 安装项目依赖..."
          npm install --production
          
          # 设置环境变量（从 GitHub Secrets）
          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_PORT="${{ secrets.DB_PORT || '3306' }}"
          
          # 同时设置 LOCAL_DB_* 变量（export.js 使用这些变量连接数据库）
          export LOCAL_DB_HOST="$DB_HOST"
          export LOCAL_DB_PORT="$DB_PORT"
          export LOCAL_DB_USER="$DB_USER"
          export LOCAL_DB_PASSWORD="$DB_PASSWORD"
          export LOCAL_DB_NAME="$DB_NAME"
          
          # 检查必要的环境变量
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
            echo "❌ 错误：缺少必要的数据库配置"
            echo "请确保在 GitHub Secrets 中配置了: DB_HOST, DB_USER, DB_PASSWORD, DB_NAME"
            exit 1
          fi
          
          echo "🔍 数据库连接: $DB_USER@$DB_HOST:$DB_PORT/$DB_NAME"
          
          if [ "$DEPLOY_TYPE" = "full" ]; then
            # ========================================
            # 完整部署：仅建表（CREATE TABLE IF NOT EXISTS），不推送数据
            # ========================================
            echo "🔄 执行完整 Schema 部署..."
            
            if [ ! -f "database.sql" ]; then
              echo "❌ 未找到 database.sql 文件"
              exit 1
            fi
            
            # 使用 process-sql.js 添加 IF NOT EXISTS
            echo "📝 处理 SQL 文件..."
            node src/process-sql.js database.sql database_safe.sql
            
            if [ $? -ne 0 ]; then
              echo "❌ SQL 文件处理失败"
              exit 1
            fi
            
            # 执行处理后的 SQL（只有 CREATE TABLE IF NOT EXISTS，没有 INSERT）
            mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -P "$DB_PORT" "$DB_NAME" < database_safe.sql
            
            if [ $? -eq 0 ]; then
              echo "✅ 完整 Schema 部署成功（仅表结构，不含数据）"
            else
              echo "❌ 完整 Schema 部署失败"
              exit 1
            fi
            
            rm -f database_safe.sql
            
          else
            # ========================================
            # 增量部署：对比 database.sql 与服务器 Schema，生成 ALTER TABLE
            # ========================================
            echo "🔄 执行增量 Schema 部署..."
            
            if [ ! -f "database.sql" ]; then
              echo "❌ 未找到 database.sql 文件"
              exit 1
            fi
            
            # 对比本地 SQL 文件与服务器数据库字段差异
            echo "🔍 对比本地 Schema 与服务器数据库字段差异..."
            node src/export.js compare -f database.sql -t "$DB_NAME" -o field_updates.sql
            
            if [ $? -ne 0 ]; then
              echo "❌ Schema 对比失败"
              exit 1
            fi
            
            echo "✅ Schema 对比完成"
            
            # 显示生成的更新脚本内容
            echo "📋 生成的更新脚本:"
            echo "----------------------------------------"
            cat field_updates.sql
            echo "----------------------------------------"
            
            # 检查是否有差异
            if grep -q "没有发现字段差异" field_updates.sql; then
              echo "✅ 没有发现 Schema 差异，无需更新"
            else
              echo "📝 发现 Schema 差异"
              
              if [ "$AUTO_EXECUTE" = "true" ]; then
                echo "🚀 自动执行 Schema 更新..."
                mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -P "$DB_PORT" "$DB_NAME" < field_updates.sql
                
                if [ $? -eq 0 ]; then
                  echo "✅ Schema 增量更新成功"
                else
                  echo "❌ Schema 增量更新失败"
                  exit 1
                fi
              else
                echo "📋 Schema 更新脚本已生成，跳过自动执行"
              fi
            fi
            
            rm -f field_updates.sql
          fi
          
          # 验证部署结果
          echo ""
          echo "🔍 验证部署结果..."
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -P "$DB_PORT" "$DB_NAME" -e "
            SELECT TABLE_NAME, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_DEFAULT
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_SCHEMA = '$DB_NAME'
            ORDER BY TABLE_NAME, ORDINAL_POSITION;
          " 2>/dev/null | head -80
          
          echo ""
          echo "🎉 部署完成！"
          echo "🌐 数据库地址: $DB_HOST:$DB_PORT"
          echo "📊 数据库名称: $DB_NAME"
          echo "🔧 部署类型: $DEPLOY_TYPE（仅 Schema，不含数据）"

    - name: 🔄 重启应用
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT || '22' }}
        script: |
          echo "🔄 检查是否需要重启应用..."
          
          if command -v pm2 &> /dev/null; then
            echo "🔄 重启 PM2 应用..."
            pm2 restart all || echo "PM2 重启失败或无应用运行"
          fi
          
          if command -v docker &> /dev/null; then
            echo "🔄 重启 Docker 容器..."
            docker compose restart 2>/dev/null || docker-compose restart 2>/dev/null || echo "Docker 重启失败或无容器运行"
          fi
          
          echo "✅ 应用重启检查完成"

    - name: 🧹 清理临时文件
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT || '22' }}
        script: |
          echo "🧹 清理临时文件..."
          rm -rf /tmp/movies-mysql-deploy
          echo "✅ 清理完成"
